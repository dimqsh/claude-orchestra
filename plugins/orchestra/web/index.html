<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#010102" media="(prefers-color-scheme: dark)">
<title>Orchestra · Claude Code agents</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23171717'/%3E%3Cpath d='M12 16c5 0 4-6.5 10-6.5M12 16c5 0 4 6.5 10 6.5' fill='none' stroke='%23fff' stroke-width='1.8'/%3E%3Ccircle cx='11' cy='16' r='3.4' fill='%23fff'/%3E%3Ccircle cx='23' cy='9.5' r='2.6' fill='%23fff'/%3E%3Ccircle cx='23' cy='22.5' r='2.6' fill='%23fff'/%3E%3C/svg%3E">
<style>
/*
  Design basis: Vercel DESIGN.md (light neutrals, 4px spacing scale, tight display tracking, hairline surfaces)
  and Linear DESIGN.md (the near-black dark neutrals). Executor and status colours are fixed by CONTRACT s.8.
  Colour lives on data only: edges, orbs, badges, token bars. Chrome stays neutral. No gradients, no resting shadows.
*/
:root {
  color-scheme: light dark;
  --canvas: #fafafa;
  --surface: #ffffff;
  --active: #f0f0f0;
  --ink: #171717;
  --body: #4d4d4d;
  --muted: #6b6b6b;
  --hair: #ebebeb;
  --hair-2: #d4d4d4;
  --dots: #e6e6e6;
  --focus: #171717;
  --shadow: 0 8px 28px rgba(0, 0, 0, .12);

  --opus: #D97757; /* taste-skill-ignore: executor colour fixed by CONTRACT s.8, used on data only */
  --codex: #10A37F; --sonnet: #7C6CF2;
  --haiku: #3BA7E0; --fable: #C9A227; --other: #8A8F98;
  --done: #2E9E5B; --running: #E0A030; --review: #3BA7E0;
  --rework: #C77DDB; --failed: #D9534F; --queued: #8A8F98;
  --on-badge: #101010;
  --pos-bg: #dcfae5; --pos-ink: #04250e; --warn-bg: #fffbeb; --warn-ink: #92400e;

  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --r-lane: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --canvas: #010102;
    --surface: #0f1011;
    --active: #1a1b1d;
    --ink: #f7f8f8;
    --body: #d0d6e0;
    --muted: #8a8f98;
    --hair: #23252a;
    --hair-2: #34343a;
    --dots: #1b1c1f;
    --focus: #f7f8f8;
    --shadow: 0 10px 32px rgba(0, 0, 0, .6);
    --pos-bg: #172a1d; --pos-ink: #3fc07a; --warn-bg: #2a2110; --warn-ink: #e6b95c;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-top: 64px; touch-action: manipulation; }
body {
  margin: 0; min-height: 100vh;
  background: var(--canvas); color: var(--ink);
  font: 400 14px/20px var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }
code { font-family: var(--mono); font-size: 13px; background: var(--active); padding: 1px 6px; border-radius: 4px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { position: absolute; left: 16px; top: -48px; z-index: 60; padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--canvas); text-decoration: none; }
.skip:focus { top: 8px; }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: 0; z-index: 20; height: 48px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 0 max(24px, env(safe-area-inset-right), calc((100% - 1320px) / 2 + 24px)) 0 max(24px, env(safe-area-inset-left), calc((100% - 1320px) / 2 + 24px));
  background: var(--canvas); border-bottom: 1px solid var(--hair);
}
.brand { flex: none; display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; letter-spacing: -.01em; color: var(--ink); text-decoration: none; border-radius: 8px; }
.brand svg { width: 24px; height: 24px; display: block; }
.brand:hover span { opacity: .72; }
.conn { display: inline-flex; align-items: center; gap: 8px; min-width: 0; color: var(--muted); font-size: 13px; white-space: nowrap; }
.conn span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--queued); flex: none; }
.conn[data-k="live"] i { background: var(--done); }
.conn[data-k="poll"] i { background: var(--running); }
.conn[data-k="lost"] i { background: var(--failed); }
.conn[data-k="mock"] i { background: var(--review); }

/* ---------- page ---------- */
main { max-width: 1320px; margin: 0 auto; padding: 24px max(24px, env(safe-area-inset-right)) max(64px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 24px; }
.pt[hidden], #state[hidden] { display: none; }
.pt h1 { text-wrap: balance; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -.02em; }
.pt p { margin-top: 2px; color: var(--muted); font-size: 14px; }
#lanes { display: flex; flex-direction: column; gap: 24px; }

/* ---------- lane (one per Claude Code session) ---------- */
.lane { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r-lane); overflow: clip; }
.lh { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 430px); gap: 16px 40px; padding: 20px 24px 18px; align-items: start; }
.lh-l { min-width: 0; }
.name { font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.single .name { font-size: 30px; line-height: 36px; letter-spacing: -.035em; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 16px; margin-top: 6px; color: var(--muted); font-size: 13px; line-height: 20px; }
.meta .br { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 13px; color: var(--body); min-width: 0; }
.meta .br svg { width: 14px; height: 14px; flex: none; color: var(--muted); }
.meta .brt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 28ch; }
.meta .fin { color: var(--body); }
.meta .landed { display: inline-flex; align-items: center; gap: 7px; color: var(--body); white-space: nowrap; }
.meta .landed .bdg { width: 16px; height: 16px; }
.meta .landed .bdg svg { width: 11px; height: 11px; }
.meta .la::before { content: "· "; }
.sum { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 13px; color: var(--body); min-height: 20px; }
.sum .sm { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.sum .sm b { color: var(--ink); font-weight: 600; }

.lh-r { min-width: 0; }
.sigma { display: flex; align-items: baseline; justify-content: flex-end; gap: 8px; white-space: nowrap; }
.sigma .sg { font-size: 18px; color: var(--muted); font-weight: 400; }
.sigma .sv { font-size: 28px; line-height: 32px; font-weight: 600; letter-spacing: -.03em; }
.sigma .su { font-size: 13px; color: var(--muted); }
.share { display: flex; gap: 2px; height: 6px; margin-top: 10px; border-radius: 3px; overflow: hidden; background: var(--hair); }
.share i { flex-basis: 0; min-width: 2px; background: var(--c); }
.kbline { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 8px; font-size: 13px; line-height: 20px; color: var(--muted); white-space: nowrap; }
.kbline svg { width: 14px; height: 14px; flex: none; }
.legend { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 16px; margin-top: 10px; font-size: 13px; }
.lg { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--body); }
.lg b { color: var(--ink); font-weight: 600; }
.xd { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }

.body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; border-top: 1px solid var(--hair); }

/* ---------- graph ---------- */
.graph { position: relative; min-height: var(--gh, 320px); min-width: 0; }
.graph .edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.dotfill { fill: var(--dots); }
.graph:not(.ready) .nodes { visibility: hidden; }
.nodes { position: absolute; inset: 0; }

.eg { --c: var(--other); }
.edge { fill: none; stroke: var(--c); stroke-linecap: round; opacity: .9; }
.eg.s-queued .edge { stroke-dasharray: 1 7; opacity: .75; }
.eg.s-failed .edge { stroke-dasharray: 5 5; }
.trunk { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; opacity: .45; }
.ptc { fill: var(--c); }
.eg:not(.s-running) .ptc { display: none; }

.pill {
  position: absolute; left: 0; top: 0; pointer-events: none;
  transform: translate(var(--x, 0px), var(--y, 0px)) translate(-50%, -50%);
  height: 22px; padding: 0 8px; display: inline-flex; align-items: center;
  background: var(--surface); border: 1px solid var(--c); border-radius: 11px;
  font-size: 12px; line-height: 1; font-weight: 600; color: var(--ink); white-space: nowrap;
}
.pill.dim { border-color: var(--hair-2); color: var(--muted); font-weight: 400; }
.pill span { display: block; }

.node {
  position: absolute; left: 0; top: 0; width: var(--w, 120px);
  transform: translate(var(--x, 0px), var(--y, 0px));
  display: flex; padding: 0; margin: 0; border: 0; background: none; text-align: left; border-radius: 12px; cursor: default;
}
.node.under { flex-direction: column; align-items: center; text-align: center; }
.node.side { flex-direction: row; align-items: center; gap: 10px; }
.orb {
  position: relative; flex: none; width: var(--d, 48px); height: var(--d, 48px); border-radius: 50%;
  background: var(--c); color: var(--on, #fff); display: grid; place-items: center;
  transition: transform .16s ease-out;
}
.sq .orb { border-radius: calc(var(--d) * .3); }
.orb .gl { width: calc(var(--d) * .5); height: calc(var(--d) * .5); }
.node:hover .orb, .node.hl .orb { transform: scale(1.07); }
.x-opus { --c: var(--opus); --on: #fff; } .x-codex { --c: var(--codex); --on: #fff; } .x-sonnet { --c: var(--sonnet); --on: #fff; }
.x-haiku { --c: var(--haiku); --on: #101010; } .x-fable { --c: var(--fable); --on: #101010; } .x-other { --c: var(--other); --on: #fff; }
.x-ink { --c: var(--ink); --on: var(--surface); }
.x-more .orb { background: transparent; border: 1.5px dashed var(--hair-2); color: var(--muted); }
.node.s-queued .orb { background: var(--surface); border: 2px solid var(--c); color: var(--c); }
.s-running .orb::after {
  content: ""; position: absolute; inset: -1px; border-radius: inherit; border: 2px solid var(--c);
  opacity: 0; pointer-events: none; animation: ring 2.2s ease-out infinite;
}
@keyframes ring { 0% { opacity: .5; transform: scale(1); } 100% { opacity: 0; transform: scale(1.5); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes tipin { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

.lab { display: flex; flex-direction: column; min-width: 0; max-width: 100%; }
.under .lab { align-items: center; margin-top: 9px; width: 100%; }
.t { max-width: 100%; font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: -.005em; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t .id { font-family: var(--mono); font-weight: 400; font-size: 13px; color: var(--muted); margin-right: 5px; }
.sub { max-width: 100%; font-size: 13px; line-height: 17px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mdl { display: flex; align-items: center; gap: 6px; max-width: 100%; min-width: 0; min-height: 18px; margin: 1px 0; }
.under .mdl { justify-content: center; }
.mdl .kind { height: 16px; padding: 0 5px; }
.mdl .mt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12px; line-height: 16px; color: var(--muted); }
.dots { display: flex; gap: 5px; margin-top: 8px; min-height: 8px; }
.dots:empty { display: none; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }

/* status badge: filled disc in the status colour with a dark glyph (>= 4.7:1 on every status colour) */
.bdg { --sc: var(--queued); flex: none; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--sc); color: var(--on-badge); }
.bdg svg { width: 12px; height: 12px; display: block; }
.orb .bdg { position: absolute; right: -6px; bottom: -6px; width: 22px; height: 22px; border: 2px solid var(--surface); }
.s-done { --sc: var(--done); } .s-running { --sc: var(--running); } .s-review { --sc: var(--review); }
.s-rework { --sc: var(--rework); } .s-failed { --sc: var(--failed); } .s-queued, .s-stopped { --sc: var(--queued); }
.node.sm .orb .bdg { width: 18px; height: 18px; right: -5px; bottom: -5px; }
.node.sm .orb .bdg svg { width: 10px; height: 10px; }
.s-running .bdg svg { animation: spin 1.8s linear infinite; }

/* ---------- shared memory strip ---------- */
.kb { border-top: 1px solid var(--hair); padding: 14px 24px 10px; }
.kh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 16px; margin-bottom: 8px; }
.kt { font-size: 14px; line-height: 20px; font-weight: 600; }
.kt::after { content: ":"; }
.ks { font-size: 13px; line-height: 20px; color: var(--muted); }
.kr { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; }
.note { min-width: 0; height: 50px; display: flex; flex-direction: column; justify-content: center; gap: 3px; border-top: 1px solid var(--hair); }
.nl1, .nl2 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ntt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--ink); }
.note.is-stale .ntt { color: var(--muted); }
.nl2 { font-size: 13px; line-height: 18px; color: var(--muted); white-space: nowrap; }
.nwho { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.nago::before { content: "· "; }

/* ---------- other sessions: one compact row each, expandable in place ---------- */
.fold { height: 24px; padding: 0 10px; border: 1px solid var(--hair-2); border-radius: 6px; background: none; color: var(--body); font-size: 13px; line-height: 1; cursor: pointer; }
.fold:hover { background: var(--active); border-color: var(--muted); }
.fold:active { transform: translateY(1px); }
.oh { font-size: 13px; line-height: 20px; font-weight: 600; color: var(--body); padding: 0 12px 8px; }
#olist { border-top: 1px solid var(--hair); }
.oth { border-bottom: 1px solid var(--hair); }
.oth.open { padding: 16px 0; border-bottom: 0; }
.orow {
  display: grid; grid-template-columns: 16px minmax(0, auto) minmax(0, 1fr) auto 118px 16px; grid-template-areas: "ic nm br tk ag ch";
  align-items: center; gap: 0 14px; width: 100%; min-height: 44px; padding: 0 12px;
  border: 0; border-radius: 8px; background: none; text-align: left; cursor: pointer;
}
.orow:hover { background: var(--active); }
.orow:focus-visible { outline-offset: -2px; }
.orow .ic { grid-area: ic; width: 16px; height: 16px; color: var(--muted); }
.orow .nm { grid-area: nm; font-size: 14px; font-weight: 600; letter-spacing: -.005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.orow .br { grid-area: br; display: inline-flex; align-items: center; gap: 6px; min-width: 0; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.orow .br svg { width: 14px; height: 14px; flex: none; }
.orow .brt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.orow .tk { grid-area: tk; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--body); white-space: nowrap; }
.orow .ag { grid-area: ag; text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; }
.orow .ch { grid-area: ch; width: 16px; height: 16px; color: var(--muted); }

/* ---------- tasks panel ---------- */
.panel { min-width: 0; min-height: var(--ph, 0px); border-left: 1px solid var(--hair); display: flex; flex-direction: column; }
.ph { height: 52px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--hair); }
.ph h2, .ph h3 { font-size: 14px; line-height: 20px; font-weight: 600; }
.ph .pc { font-size: 13px; color: var(--muted); }
.groups { padding-bottom: 12px; flex: 1 1 auto; min-height: 0; }
@media (min-width: 861px) {
  .panel { max-height: var(--pmax, none); }
  .groups { overflow-y: auto; overscroll-behavior: contain; }
}
.gh { height: 32px; display: flex; align-items: flex-end; gap: 6px; padding: 0 20px 6px; font-size: 13px; line-height: 16px; color: var(--muted); }
.row {
  display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 12px;
  width: 100%; height: 52px; padding: 0 20px; border: 0; background: none; text-align: left; cursor: default;
}
.row { position: relative; }
.row.child { padding-left: 46px; }
.row.child::before { content: ""; position: absolute; left: 29px; top: 0; width: 12px; height: 26px; border-left: 1.5px solid var(--hair-2); border-bottom: 1.5px solid var(--hair-2); border-bottom-left-radius: 7px; pointer-events: none; }
.row.child.cont::after { content: ""; position: absolute; left: 29px; top: 26px; bottom: 0; border-left: 1.5px solid var(--hair-2); pointer-events: none; }
.row:hover, .row.hl { background: var(--active); }
.row:focus-visible { outline-offset: -2px; border-radius: 8px; }
.rt { min-width: 0; display: flex; flex-direction: column; }
.rt .l1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.rt .l1 .t { min-width: 0; }
.mg, .stale { flex: none; height: 18px; padding: 0 7px; display: inline-flex; align-items: center; border-radius: 9px; font-size: 12px; line-height: 1; font-weight: 600; white-space: nowrap; }
.mg { background: var(--pos-bg); color: var(--pos-ink); }
.stale { background: var(--warn-bg); color: var(--warn-ink); font-weight: 500; }
.kind { flex: none; height: 18px; padding: 0 6px; display: inline-flex; align-items: center; border-radius: 4px; background: var(--active); color: var(--body); font-size: 12px; line-height: 1; white-space: nowrap; }
.kind.mono { height: auto; min-height: 18px; padding: 2px 6px; font-family: var(--mono); line-height: 14px; white-space: normal; overflow-wrap: anywhere; }
.rt .t { font-size: 13px; }
.rt .sub { display: flex; align-items: center; gap: 6px; }
.rt .sub span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rk { font-size: 13px; font-weight: 600; color: var(--ink); text-align: right; }
.rk.none { color: var(--muted); font-weight: 400; }
.pempty { padding: 20px; color: var(--muted); font-size: 13px; }

/* ---------- empty / loading / error ---------- */
.empty {
  border: 1px dashed var(--hair-2); border-radius: var(--r-lane); min-height: 340px; padding: 40px 24px;
  display: grid; place-items: center; text-align: center; color: var(--muted);
}
.empty svg { width: min(360px, 80%); height: auto; display: block; margin: 0 auto 20px; }
.empty .ghost { fill: none; stroke: var(--hair-2); stroke-width: 1.5; stroke-dasharray: 3 5; }
.empty p { text-wrap: pretty; max-width: 52ch; margin: 0 auto; font-size: 14px; line-height: 22px; }
.empty .btn { margin-top: 16px; }
.btn { height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--hair-2); background: var(--surface); color: var(--ink); font-weight: 500; cursor: pointer; }
.btn:hover { background: var(--active); border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.skel { display: block; border-radius: 6px; background: var(--hair); }

/* ---------- detail popover ---------- */
.tip {
  position: fixed; left: 0; top: 0; z-index: 50; width: min(356px, calc(100vw - 16px));
  background: var(--surface); color: var(--ink); border: 1px solid var(--hair-2); border-radius: 10px;
  padding: 14px 16px 12px; box-shadow: var(--shadow); pointer-events: none; font-size: 13px; line-height: 18px;
  animation: tipin .12s ease-out;
}
.tip[hidden] { display: none; }
.tip .th { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; line-height: 20px; }
.tip .th span { min-width: 0; overflow-wrap: anywhere; }
.tip .tm { margin-top: 2px; font-family: var(--mono); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.tip dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 12px 0 0; }
.tip dt { color: var(--muted); }
.tip dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; }
.tip dd .mono { font-family: var(--mono); font-size: 12px; }

    updatedAt: s.updatedAt, items, shown, hidden, counts, execs, byExec, spent, orchTok,
    orchModel: s.orchestrator && s.orchestrator.model, hasBoard: !!tasks, finished: !!(s.board && s.board.finishedAt),
    lines: shown.some((i) => i.kind === 'task' || i.kind === 'agent') ? 3 : 2,   /* fixed by item kind, so a model arriving later never moves the page */
    boardTitle: s.board && s.board.title, struct, roomy: laneCount <= 2 ? struct.R1 <= 6 : struct.R1 <= 3,
    integ: (s.board && s.board.integration) || null, kb: normKb(s.kb),
  };
}

/* Second line of a label. In the graph the model line already names the executor, so the name is dropped there;
   in the panel a merged task shows its attempts instead of "done" (the pill and the check badge say the rest). */
function subText(it, forGraph) {
  const ex = EXEC_NAME[it.executor], st = statusInfo(it.status);
  const tries = it.attempts > 1 ? it.attempts + NB + 'attempts' : '';
  const line = (d) => (forGraph && it.modelLabel ? d : ex + ' · ' + d);
  if (st.cls === 'running') return line(it.activity || st.label);
  if (st.cls === 'queued') return line(it.deps.length ? 'waits on ' + it.deps.map((x) => '#' + x).join(', ') : st.label);
  if (st.cls === 'rework') return line(it.note || st.label);
  if (st.cls === 'done' && it.merged) return forGraph ? line(['merged', tries].filter(Boolean).join(' · ')) : (tries || line(st.label));   /* the pill shares the panel line */
  if (st.cls === 'done') return line([st.label, tries].filter(Boolean).join(' · '));
  return line(st.label);
}

/* ================= geometry (pure function of the view model and the box) ================= */
const bez = (a, b, c, d, t) => { const u = 1 - t; return u * u * u * a + 3 * u * u * t * b + 3 * u * t * t * c + t * t * t * d; };

const TREE = { xT: 34, yP: 34, yO: 120, y0: 198, pitch: 62 };   /* vertical tree for narrow graphs */
/* a label is 3 lines (title, type and model, status); 2 only for a lane with nothing to label */
const ROOMY_R = 24;
const roomyPitch = (lines) => (lines === 3 ? 118 : 96);
const compactPitch = (lines) => (lines === 3 ? 62 : 58);
/* first orb top to last label bottom = (rows-1) pitches + R + HANG */
const roomySpan = (n, lines) => Math.max(0, n - 1) * roomyPitch(lines) + ROOMY_R + (lines === 3 ? 89 : 69);
/* with a sub-task column the wide layout needs more room, so it folds to the vertical tree earlier */
const isTree = (vm, W) => W < NARROW || (vm.struct.hasKids && W < (vm.roomy ? 700 : 640));
function graphMin(vm, W) {
  const n = vm.shown.length, R = vm.roomy ? vm.struct.R1 : vm.struct.R2;
  if (isTree(vm, W)) return n ? TREE.y0 + (n - 1) * TREE.pitch + 19 + 28 : TREE.yO + 26 + 60;
  return Math.max(300, vm.roomy ? roomySpan(R, vm.lines) + 56 : R * compactPitch(vm.lines) + 48);
}
const panelMin = (vm) => PANEL_HEAD + vm.items.length * ROW_H + Math.min(vm.items.length, GROUPS.length) * GH_H + 16;

function geometry(vm, W, H) {
  const st = vm.struct, n = vm.shown.length, kids = st.hasKids;
  const tree = isTree(vm, W), roomy = !tree && vm.roomy, R = roomy ? st.R1 : st.R2;
  const G = { tree, roomy, nodes: [], edges: [], pills: [] };
  const maxS = Math.max(1, ...vm.shown.map((i) => i.tokens.spent));
  const ew = (i) => 1.5 + 2.5 * Math.sqrt(i.tokens.spent / maxS);
  const pillText = (i) => (i.tokens.spent > 0 ? fmt(i.tokens.spent) : '—');
  const node = (it, x, y, r, w, under) => G.nodes.push({ key: it.key, role: it.kind === 'more' ? 'more' : 'i', item: it, x, y, r, w, under });
  const edge = (it, d, px, py) => {
    G.edges.push({ key: it.key, exec: it.executor, status: statusInfo(it.status).cls, d, w: ew(it) });
    G.pills.push({ key: it.key, exec: it.executor, text: pillText(it), dim: it.tokens.spent === 0, x: px, y: py });
  };
  const curve = (sx, sy, tx, ty) => { const dx = (tx - sx) / 2; return [`M${sx} ${sy}C${sx + dx} ${sy} ${tx - dx} ${ty} ${tx} ${ty}`, bez(sx, sx + dx, tx - dx, tx, 0.58), bez(sy, sy, ty, ty, 0.58)]; };

  if (!tree) {
    const rP = 22, rO = 30, rI = roomy ? ROOMY_R : 19, rC = roomy ? 20 : 16, pitch = roomy ? roomyPitch(vm.lines) : compactPitch(vm.lines);
    const yFirst = roomy ? (H - roomySpan(R, vm.lines)) / 2 + rI : H / 2 - (R - 1) * pitch / 2;
    const rowY = (r) => yFirst + r * pitch;
    const cy = R ? (rowY(0) + rowY(R - 1)) / 2 : H / 2 - 20;
    const labW = roomy ? 164 : clamp(W * (kids ? 0.16 : 0.22), kids ? 120 : 140, kids ? 180 : 210);
    const xP = Math.max(72, W * (kids ? 0.09 : 0.11));
    const xO = Math.max(xP + 140, W * (kids ? 0.27 : roomy ? 0.42 : 0.35));
    const kOff = 96;                                   /* compact: how far a sub-task is indented under its parent */
    let xI, xC = 0;
    if (!kids) xI = roomy ? W - Math.max(98, W * 0.14) : W - 16 - (2 * rI + 10 + labW) + rI;
    else if (roomy) { xC = W - Math.max(98, W * 0.12); xI = Math.max(xC - 190, xO + rO + rI + 90); }
    else xI = Math.max(W - 16 - (kOff + rC + 10 + labW), xO + rO + rI + 90);
    let subs = '';
    G.nodes.push({ key: 'p', role: 'p', x: xP, y: cy, r: rP, w: 136, under: true });
    G.nodes.push({ key: 'o', role: 'o', x: xO, y: cy, r: rO, w: 120, under: true });
    G.edges.push({ key: 'po', exec: 'opus', status: 'running', d: `M${xP + rP} ${cy}L${xO - rO} ${cy}`, w: 2.5 });
    G.pills.push({ key: 'po', exec: 'opus', text: fmt(vm.orchTok.spent), x: (xP + rP + xO - rO) / 2, y: cy });
    for (const t of st.tops) {
      const yT = roomy ? rowY(t.s1 + (t.z1 - 1) / 2) : rowY(t.s2);
      node(t.it, xI, yT, rI, roomy ? labW : 2 * rI + 10 + labW, roomy);
      if (t.it.kind !== 'more') { const [d, px, py] = curve(xO + rO, cy, xI - rI, yT); edge(t.it, d, px, py); }
      t.kids.forEach((k, j) => {                      /* sub-task: its own edge from the parent node, not from Opus */
        if (roomy) {
          const yK = rowY(t.s1 + j);
          node(k, xC, yK, rC, labW, true);
          const [d, px, py] = curve(xI + rI, yT, xC - rC, yK); edge(k, d, px, py);
        } else {
          const yK = rowY(t.s2 + 1 + j), xK = xI + kOff, tx = xK - rC;
          node(k, xK, yK, rC, 2 * rC + 10 + labW, false);
          edge(k, `M${xI} ${yK - 14}Q${xI} ${yK} ${xI + 14} ${yK}H${tx}`, xI + 14 + (tx - xI - 14) / 2, yK);
          if (j === t.kids.length - 1) subs += `M${xI} ${yT + rI}V${yK - 14}`;
        }
      });
    }
    if (subs) G.trunk = subs;
  } else {
    const { xT, yP, yO, y0, pitch } = TREE, rP = 20, rO = 26, rI = 19, rK = 15;
    const xI = xT + (kids ? 100 : 124), xK = xI + (W < 340 ? 84 : 92);
    const labI = Math.max(80, W - (xI + rI + 10) - 12), labK = Math.max(36, W - (xK + rK + 8) - 10);
    G.nodes.push({ key: 'p', role: 'p', x: xT, y: yP, r: rP, w: W - (xT - rP) - 12, under: false });
    G.nodes.push({ key: 'o', role: 'o', x: xT, y: yO, r: rO, w: W - (xT - rO) - 12, under: false });
    G.edges.push({ key: 'po', exec: 'opus', status: 'running', d: `M${xT} ${yP + rP}L${xT} ${yO - rO}`, w: 2.5 });
    G.pills.push({ key: 'po', exec: 'opus', text: fmt(vm.orchTok.spent), x: xT, y: (yP + rP + yO - rO) / 2 });
    let i = 0, lastTopY = y0, subs = '';
    for (const t of st.tops) {
      const y = y0 + i * pitch; lastTopY = y;
      node(t.it, xI, y, rI, 2 * rI + 10 + labI, false);
      if (t.it.kind !== 'more') { const tx = xI - rI; edge(t.it, `M${xT} ${y - 20}Q${xT} ${y} ${xT + 20} ${y}H${tx}`, xT + 20 + (tx - xT - 20) / 2, y); }
      i++;
      let yLast = y;
      for (const k of t.kids) {
        const yk = y0 + i * pitch; yLast = yk;
        node(k, xK, yk, rK, 2 * rK + 8 + labK, false);
        const tx = xK - rK;
        edge(k, `M${xI} ${yk - 18}Q${xI} ${yk} ${xI + 18} ${yk}H${tx}`, xI + 18 + (tx - xI - 18) / 2, yk);
        i++;
      }
      if (t.kids.length) subs += `M${xI} ${y + rI}V${yLast - 18}`;
    }
    if (st.tops.length) G.trunk = `M${xT} ${yO + rO}V${lastTopY - 20}` + subs;
  }
  return G;
}

/* ================= state ================= */
const mainEl = $('#main'), lanesEl = $('#lanes'), titleEl = $('#title'), stateEl = $('#state'), tipEl = $('#tip');
const othersEl = $('#others'), othersH = $('#othersH'), olist = $('#olist');
const S = { snap: null, order: [], conn: 'connecting', vms: new Map(), error: null, mock: false, tip: null, expanded: new Set(), focusAfter: null };
const isIdle = (s) => !(s.agents && s.agents.length) && !(s.board && s.board.tasks && s.board.tasks.length);

const ro = new ResizeObserver((entries) => {
  for (const e of entries) {
    const lane = e.target._lane;
    if (!lane) continue;
    const w = Math.round(e.contentRect.width), hh = Math.round(e.contentRect.height);
    if (w === lane._w && hh === lane._h) continue;
    lane._w = w; lane._h = hh;
    applyHeights(lane);
    paint(lane);
  }
});

/* ================= lane construction ================= */
function makeLane() {
  const el = h('section', 'lane');
  el.innerHTML =
    '<header class="lh"><div class="lh-l">' +

      '<div class="sum"></div></div>' +

  const r = {
    name: $('.name', el), brt: $('.brt', el), br: $('.br', el), fin: $('.fin', el), ago: $('.ago', el), fold: $('.fold', el), sum: $('.sum', el),
    landed: $('.landed', el), la: $('.la', el), kbline: $('.kbline', el), kbtxt: $('.kbline span', el), kb: $('.kb', el), kt: $('.kt', el), ks: $('.ks', el), kr: $('.kr', el),
    sv: $('.sv', el), share: $('.share', el), legend: $('.legend', el), graph: $('.graph', el), layer: $('.layer', el),
    trunk: $('.trunk', el), nodes: $('.nodes', el), panel: $('.panel', el), ph: $('h3', el), pc: $('.pc', el), groups: $('.groups', el),

function swapTag(lane, key, tag) {
  const old = lane._r[key];
  if (old.tagName.toLowerCase() === tag) return;
  const n = h(tag, old.className);
  if (old.hasAttribute('translate')) n.setAttribute('translate', old.getAttribute('translate'));
  n.append(...old.childNodes);
  old.replaceWith(n);
  lane._r[key] = n;
}

function updateLane(lane, s, single, count, foldable) {
  const vm = buildVM(s, count);
  lane._vm = vm; lane._s = s;
  S.vms.set(vm.key, vm);
  const r = lane._r;
  setCls(lane, 'lane' + (single ? ' single' : ''));
  swapTag(lane, 'name', single ? 'h1' : 'h2');
  swapTag(lane, 'ph', single ? 'h2' : 'h3');
  swapTag(lane, 'kt', single ? 'h2' : 'h3');
  txt(r.nm, vm.name);
  r.name.title = vm.name;
  r.br.hidden = !vm.branch;
  txt(r.brt, vm.branch || '');
  r.fin.hidden = !vm.finished;
  r.fold.hidden = !foldable;
  const landedAt = vm.integ && vm.integ.landedAt;
  r.landed.hidden = !landedAt;
  if (landedAt) { r.la.dataset.t = landedAt; txt(r.la, ago(landedAt)); }
  if (foldable) setAttr(r.fold, 'aria-label', 'Collapse session ' + vm.name);
  txt(r.ago, ago(vm.updatedAt));
  r.ago.dataset.t = vm.updatedAt;

  /* summary of work */
  const gLabel = (g) => (g.id === 'done' && !vm.hasBoard ? 'finished' : g.label);   /* agents finish, tasks are done */
  const sumItems = GROUPS.filter((g) => vm.counts[g.id] > 0).map((g) => ({ id: g.id, label: gLabel(g), n: vm.counts[g.id] }));
  sync(r.sum, sumItems, (x) => x.id, (x) => {
    const e = h('span', 'sm'); const b = h('span', 'bdg'); b.appendChild(icon('st-' + x.id)); e.append(b, h('b'), h('span'));
    e._r = { b, n: e.children[1], l: e.children[2] }; return e;
  }, (e, x) => { setCls(e._r.b, 'bdg s-' + x.id); txt(e._r.n, String(x.n)); txt(e._r.l, x.label); });
  r.sum.hidden = !sumItems.length;

  /* tokens by executor, sigma, share bar */
  const execs = EXEC_ORDER.filter((k) => vm.byExec[k] > 0);
  txt(r.sv, fmt(vm.spent));
  setAttr(r.share, 'aria-label', 'Token shares: ' + execs.map((k) => EXEC_NAME[k] + ' ' + fmt(vm.byExec[k])).join(', '));
  sync(r.share, execs, (k) => k, () => h('i'), (e, k) => { setCls(e, 'x-' + k); setVar(e, 'flex-grow', String(vm.byExec[k])); });
  sync(r.legend, execs, (k) => k, () => {
    const e = h('span', 'lg'); e.append(h('i', 'xd'), h('span'), h('b')); return e;
  }, (e, k) => { setCls(e, 'lg x-' + k); txt(e.children[1], EXEC_NAME[k]); txt(e.children[2], fmt(vm.byExec[k])); });

  /* tasks panel */
  txt(r.ph, vm.hasBoard ? 'Tasks' : 'Agents');
  txt(r.pc, String(vm.items.length));
  const rows = [];
  for (const g of GROUPS) {
    const list = vm.items.filter((i) => i.group === g.id);
    if (!list.length) continue;
    rows.push({ key: 'g:' + g.id, head: gLabel(g), n: list.length });
    const here = new Set(list.map((i) => i.key));
    const nested = (i) => i.parentKey && here.has(i.parentKey);        /* a sub-task always sits under its parent */
    for (const it of list) {
      if (nested(it)) continue;
      rows.push({ key: 'r:' + it.key, it, nested: false });
      const kids = list.filter((k) => k.parentKey === it.key);
      kids.forEach((k, j) => rows.push({ key: 'r:' + k.key, it: k, nested: true, cont: j < kids.length - 1 }));
    }
  }
  sync(r.groups, rows, (x) => x.key, (x) => (x.head ? makeGroupHead() : makeRow(lane)), (e, x) => (x.head ? updateGroupHead(e, x, single) : updateRow(e, x.it, x.nested, x.cont)));
  let empty = r.groups.querySelector('.pempty');
  if (!vm.items.length) {
    if (!empty) { empty = h('p', 'pempty', 'No tasks or agents yet.'); r.groups.appendChild(empty); }
  } else if (empty) empty.remove();

  /* shared memory: header line + strip under the body; hidden when the snapshot has no kb */
  const kb = vm.kb;
  r.kbline.hidden = !kb; r.kb.hidden = !kb;
  if (kb) {
    txt(r.kbtxt, 'memory ' + kb.notes + ' · ≈' + fmt(kb.saved) + NB + 'saved');
    txt(r.ks, kb.notes + NB + pl(kb.notes, 'note', 'notes') + ' · ' + kb.hits + NB + pl(kb.hits, 'hit', 'hits') + ' · ≈' + fmt(kb.saved) + NB + 'tokens saved');
    sync(r.kr, kb.recent, (n) => 'n:' + n.id, makeNote, updateNote);
  }

  applyHeights(lane);
  paint(lane);
  if (S.tip && S.tip.lane === vm.key) refreshTip();
}

function makeNote() {

  e.innerHTML = '<span class="nl1"><span class="ntt"></span><span class="stale" hidden>stale</span></span><span class="nl2"><span class="kind"></span><span class="nwho" translate="no"></span><span class="nago"></span></span>';
  e._r = { tt: $('.ntt', e), stale: $('.stale', e), kind: $('.kind', e), who: $('.nwho', e), ago: $('.nago', e) };

}
function updateNote(e, n) {
  const r = e._r;
  setCls(e, 'note' + (n.stale ? ' is-stale' : ''));

function makeGroupHead() { const e = h('div', 'gh'); e.setAttribute('role', 'heading'); e.append(h('span'), h('span')); return e; }
function updateGroupHead(e, x, single) { setAttr(e, 'aria-level', single ? 3 : 4); txt(e.children[0], x.head); txt(e.children[1], String(x.n)); }

function makeRow(lane) {

function updateRow(e, it, nested, cont) {
  const r = e._r, st = statusInfo(it.status);
  setCls(e, 'row' + (nested ? ' child' : '') + (cont ? ' cont' : ''));

function itemAria(it) {

/* heights are deterministic from the item count, so status changes never move the page */
function applyHeights(lane) {
  const vm = lane._vm; if (!vm) return;
  const W = lane._w || 900;
  const gh = graphMin(vm, W), ph = panelMin(vm);
  const pmax = Math.max(gh, 720);                    /* long lists scroll inside the panel instead of stretching the lane */
  setVar(lane, '--gh', gh); setVar(lane, '--ph', Math.min(ph, pmax)); setVar(lane, '--pmax', pmax);
}

/* ================= painting the graph ================= */
function paint(lane) {
  const vm = lane._vm, r = lane._r;
  if (!vm || !lane._w) return;
  const G = geometry(vm, lane._w, Math.max(lane._h, graphMin(vm, lane._w)));
  r.graph.classList.add('ready');

  const nodeDescs = G.nodes.map((d) => Object.assign({ type: 'node' }, d));
  const pillDescs = G.pills.map((d) => Object.assign({ type: 'pill' }, d, { key: 'pill:' + d.key }));
  sync(r.nodes, nodeDescs.concat(pillDescs), (d) => d.key, (d) => (d.type === 'node' ? makeNode() : makePill()), (e, d) => (d.type === 'node' ? updateNode(e, d, vm, lane) : updatePill(e, d)));

  const edgeDescs = G.edges.map((d) => Object.assign({ type: 'edge' }, d));
  sync(r.layer, edgeDescs, (d) => d.key, makeEdge, updateEdge);
  r.trunk.style.display = G.trunk ? '' : 'none';
  if (G.trunk) setAttr(r.trunk, 'd', G.trunk);
}

function makeEdge(d) {
  const g = sv('g', { class: 'eg' });
  const p = sv('path', { class: 'edge' });
  const c = sv('circle', { class: 'ptc', r: '3.2' });
  const am = sv('animateMotion', { dur: '2.4s', repeatCount: 'indefinite', begin: '-' + ((hash(d.key) % 20) / 10) + 's' });

/* Lane order: sessions with a running agent, then with an unfinished board, then the rest.
   Inside a group: newest updatedAt first. Sessions already on screen keep their relative order while
   their updatedAt falls in the same minute, so two busy sessions do not swap places every second. */
function classify(s) {
  const tasks = (s.board && s.board.tasks) || [];
  const running = (s.agents || []).some((a) => a.status === 'running');
  const open = tasks.length > 0 && !s.board.finishedAt;
  return { group: running ? 0 : open ? 1 : 2, idle: isIdle(s) };
}
function orderSessions(sessions) {
  const prev = new Map(S.order.map((id, i) => [id, i]));
  const info = sessions.map((s) => ({ s, c: classify(s), b: Math.floor((Date.parse(s.updatedAt) || 0) / 60000), p: prev.has(s.sessionId) ? prev.get(s.sessionId) : -1 }));
  const t = (i) => Date.parse(i.s.updatedAt) || 0;
  info.sort((a, b) => a.c.group - b.c.group || b.b - a.b || (a.p >= 0 && b.p >= 0 ? a.p - b.p : t(b) - t(a)));
  S.order = info.map((i) => i.s.sessionId);
  return info;
}

function render(snap) {
  S.snap = snap; S.error = null;
  const sessions = (snap && Array.isArray(snap.sessions)) ? snap.sessions : [];
  const info = orderSessions(sessions);
  const total = sessions.length;
  const compact = (i) => total > 1 && i.c.idle;               /* a lone idle session still gets its full lane */
  const main = info.filter((i) => !compact(i)), others = info.filter(compact);
  const ids = new Set(sessions.map((x) => x.sessionId));
  for (const k of [...S.vms.keys()]) if (!ids.has(k)) S.vms.delete(k);
  for (const k of [...S.expanded]) if (!ids.has(k)) S.expanded.delete(k);
  if (S.tip && !ids.has(S.tip.lane)) hideTip();
  const full = main.length + others.filter((i) => S.expanded.has(i.s.sessionId)).length;

  sync(lanesEl, main, (i) => i.s.sessionId, () => makeLane(), (el, i) => { el.dataset.key = i.s.sessionId; updateLane(el, i.s, total === 1, full, false); });
  othersEl.hidden = !others.length;
  txt(othersH, 'Other sessions · ' + others.length);
  sync(olist, others, (i) => i.s.sessionId, makeOther, (el, i) => updateOther(el, i.s, full));
  renderChrome(sessions);

  if (S.focusAfter) {                                          /* keep keyboard focus through expand / collapse */
    const [kind, id] = [S.focusAfter.slice(0, S.focusAfter.indexOf(':')), S.focusAfter.slice(S.focusAfter.indexOf(':') + 1)];

function startLive() {
  let es = null, pollT = null;
  const onSnap = (snap) => { if (snap && snap.version === 1) render(snap); };
  const poll = async () => {
    try {
      const res = await fetch('/api/snapshot', { cache: 'no-store' });
      if (!res.ok) throw new Error(String(res.status));
      onSnap(await res.json());
      if (!es || es.readyState !== 1) setConn('poll');
    } catch (_) {
      setConn('lost');
      if (!S.snap) { S.error = true; renderChrome([]); }
    }
  };
  const startPoll = () => { if (pollT) return; poll(); pollT = setInterval(poll, 2000); };
  const stopPoll = () => { clearInterval(pollT); pollT = null; };
  S.retry = () => { S.error = null; renderChrome([]); poll(); };
  if (!('EventSource' in window)) { startPoll(); return; }
  es = new EventSource('/events');
  es.onmessage = (e) => { try { onSnap(JSON.parse(e.data)); } catch (_) { return; } stopPoll(); setConn('live'); };
  es.onerror = () => { setConn(S.snap ? 'lost' : 'connecting'); startPoll(); };
}

/* ================= demo mode: ?mock=1 (optionally &stress=4x12) ================= */
const TIME_KEYS = new Set(['generatedAt', 'updatedAt', 'startedAt', 'endedAt', 'createdAt', 'finishedAt', 'landedAt']);
function rebase(o, delta) {
  if (Array.isArray(o)) { o.forEach((x) => rebase(x, delta)); return o; }
  if (o && typeof o === 'object') {
    for (const k of Object.keys(o)) {
      if (TIME_KEYS.has(k) && typeof o[k] === 'string' && !Number.isNaN(Date.parse(o[k]))) o[k] = new Date(Date.parse(o[k]) + delta).toISOString();
      else rebase(o[k], delta);
    }
  }
  return o;
}
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const POOL = {
  codex: ['editing cli.py', 'Bash pytest -q', 'thinking', 'editing export.py'],
  sonnet: ['Edit cli.py', 'Bash pytest -q', 'Read export.py', 'Grep sort_key'],
  haiku: ['Grep round(', 'Read billing.py'],
};
const NOTE_POOL = [
  ['file', 'tests/test_export.py: fixtures and a sample CSV', 'sonnet #4'], ['symbol', 'sort_tasks() sorts by (done, due)', 'codex #1'],
  ['fact', 'export is called from cli.py: cmd_export', 'sonnet #2'], ['gotcha', 'an empty CSV raises IndexError in the parser', 'codex #2.1'],
  ['command', 'pytest -k export -q', 'sonnet #4'], ['decision', 'take column names from the file header', 'opus'],
];
const MODEL = { codex: 'gpt-6.1-sol', sonnet: 'claude-sonnet-5-5', haiku: 'claude-haiku-4-5', other: null };
const spentOf = (t) => t.input + t.cacheWrite + t.output;

function stress(base, sCount, aCount, opts = {}) {
  const names = ['acme-shop', 'billing-api', 'tulpar-web', 'mangystau-app', 'sunkar-bot', 'orda-ui'];
  const exs = ['codex', 'sonnet', 'haiku', 'codex', 'sonnet', 'haiku'];
  const sts = ['running', 'done', 'queued', 'review', 'rework', 'failed', 'done', 'running', 'queued', 'done', 'running', 'done'];
  const sessions = [];
  for (let i = 0; i < sCount; i++) {
    const s = structuredClone(base.sessions[0]);
    s.sessionId = 'stress-' + i;
    s.project = { name: names[i % names.length], cwd: '/Users/you/work/' + names[i % names.length], branch: i % 3 === 2 ? null : (i % 2 ? 'fix/billing-rounding' : 'feat/export') };
    s.agents = []; const tasks = [];
    for (let k = 0; k < aCount; k++) {
      const ex = exs[(k + i) % exs.length], st = sts[(k + i * 2) % sts.length];
      const t = { id: String(k + 1), title: ['sorting bug', 'export csv/json', 'export review', 'export tests', 'docstrings', 'schema migration'][k % 6], executor: ex, status: st,
        attemptCount: st === 'queued' ? 0 : 1 + (st === 'rework' ? 0 : k % 2), dependsOn: st === 'queued' ? [String(Math.max(1, k))] : [], note: '', updatedAt: base.generatedAt, tokens: { input: 0, cacheWrite: 0, cacheRead: 0, output: 0, spent: 0 }, agentIds: [] };
      if (st !== 'queued') {
        const tk = { input: rnd(800, 20000), cacheWrite: ex === 'codex' ? 0 : rnd(500, 7000), cacheRead: rnd(10000, 90000), output: rnd(300, 3000) }; tk.spent = spentOf(tk);
        const a = { id: 's' + i + 'a' + k, kind: ex === 'codex' ? 'codex' : 'claude', type: ex === 'codex' ? 'codex' : 'general-purpose', executor: ex, model: MODEL[ex],
          description: '#' + t.id + ' ' + t.title, taskId: t.id, status: st === 'running' || st === 'review' ? 'running' : st === 'failed' ? 'failed' : 'completed',
          startedAt: new Date(Date.parse(base.generatedAt) - (aCount - k) * 40000).toISOString(), endedAt: null, activity: (POOL[ex] || POOL.sonnet)[0], tokens: tk };
        if (a.status !== 'running') a.endedAt = new Date(Date.parse(a.startedAt) + 30000).toISOString();
        s.agents.unshift(a); t.tokens = tk; t.agentIds.push(a.id);
      }
      t.parentId = null; t.branch = st === 'queued' ? null : 'orchestra/stress/' + t.id; t.merged = st === 'done';
      t.type = ['bug', 'logic', 'refactor', 'tests', 'docs', 'search'][k % 6]; t.model = ex === 'codex' ? 'gpt-6.1-sol' : ex; t.effort = ex === 'codex' ? ['high', 'medium', 'low'][k % 3] : null;
      t.attemptList = Array.from({ length: t.attemptCount }, (_, n) => ({ n: n + 1, provider: ex, model: t.model, effort: t.effort, startedAt: base.generatedAt, endedAt: null,
        outcome: n < t.attemptCount - 1 ? 'failed' : ({ done: 'accepted', failed: 'failed', rework: 'rework' })[st] || null, tokens: n < t.attemptCount - 1 || ['done', 'failed', 'rework'].includes(st) ? rnd(1500, 20000) : null }));
      tasks.push(t);
      if (opts.kids && k % 3 === 0 && st !== 'queued') {                 /* a Codex sub-task under every third task */
        const cs = ['running', 'review', 'done'][(k / 3 + i) % 3];
        const ck = { input: rnd(800, 9000), cacheWrite: 0, cacheRead: rnd(5000, 40000), output: rnd(200, 1500) }; ck.spent = spentOf(ck);
        const kid = { id: t.id + '.1', title: 'sub-task ' + t.id, executor: 'codex', model: 'gpt-6.1-sol', effort: 'medium', type: 'tests', status: cs, attemptCount: 1, attemptList: [{ n: 1, provider: 'codex', model: 'gpt-6.1-sol', effort: 'medium', startedAt: base.generatedAt, endedAt: null, outcome: cs === 'done' ? 'accepted' : null, tokens: cs === 'done' ? ck.spent : null }], dependsOn: [], note: '', updatedAt: base.generatedAt, tokens: ck, agentIds: [],
          parentId: t.id, branch: 'orchestra/stress/' + t.id + '.1', merged: cs === 'done' };
        const ka = { id: 's' + i + 'k' + k, kind: 'codex', type: 'codex', executor: 'codex', model: MODEL.codex, description: '#' + kid.id + ' ' + kid.title, taskId: kid.id,
          status: cs === 'running' ? 'running' : 'completed', startedAt: new Date(Date.parse(base.generatedAt) - 20000).toISOString(), endedAt: cs === 'running' ? null : base.generatedAt, activity: POOL.codex[0], tokens: ck };
        s.agents.unshift(ka); kid.agentIds.push(ka.id); tasks.push(kid);
      }
    }
    if (!opts.kb) s.kb = null;
    s.board = { title: 'stress', createdAt: base.generatedAt, finishedAt: null, tasks, integration: null };
    s.totals = { byExecutor: {}, spent: 0, tasks: { done: 0, running: 0, review: 0, queued: 0, failed: 0 } };
    sessions.push(s);
  }
  const out = { version: 1, generatedAt: base.generatedAt, sessions };
  out.sessions.forEach(recompute);
  return out;
}

function recompute(s) {
  const by = {};
  const add = (k, v) => { by[k] = (by[k] || 0) + v; };
  s.orchestrator.tokens.spent = spentOf(s.orchestrator.tokens);
  add('opus', s.orchestrator.tokens.spent);
  for (const a of s.agents) add(execKey(a.executor), a.tokens.spent);
  s.totals.byExecutor = by;
  s.totals.spent = Object.values(by).reduce((x, y) => x + y, 0);
  const c = { done: 0, running: 0, review: 0, queued: 0, failed: 0 };
  if (s.board) for (const t of s.board.tasks) {
    const own = s.agents.filter((a) => a.taskId === t.id);
    t.tokens = own.reduce((x, a) => ({ input: x.input + a.tokens.input, cacheWrite: x.cacheWrite + a.tokens.cacheWrite, cacheRead: x.cacheRead + a.tokens.cacheRead, output: x.output + a.tokens.output, spent: x.spent + a.tokens.spent }), zeroTok());
    t.agentIds = own.map((a) => a.id).reverse();
    if (t.status === 'done') c.done++; else if (t.status === 'running' || t.status === 'rework') c.running++; else if (t.status === 'review') c.review++; else if (t.status === 'queued') c.queued++; else if (t.status === 'failed') c.failed++;
  }
  s.totals.tasks = c;
}

async function startMock() {
  S.mock = true; setConn('mock');
  let base;
  try {
    const res = await fetch('./mock-snapshot.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(String(res.status));
    base = await res.json();
  } catch (_) { S.error = true; setConn('lost'); renderChrome([]); return; }
  const qs = new URLSearchParams(location.search), st = /^(\d+)x(\d+)$/.exec(qs.get('stress') || '');
  if (qs.get('mock') === 'empty') base = { version: 1, generatedAt: base.generatedAt, sessions: [] };
  rebase(base, Date.now() - Date.parse(base.generatedAt));
  if (st) base = stress(base, clamp(+st[1], 1, 6), clamp(+st[2], 0, 30), { kids: qs.get('kids') === '1', kb: qs.get('kb') !== '0' });
  const pristine = structuredClone(base);
  const snap = structuredClone(base);
  let tick = 0, counter = 1;
  S.retry = null;
  render(snap);

  const spawn = (s, t) => {
    const ex = execKey(t.executor, t.model);
    s.agents.unshift({ id: 'mock-' + (counter++), kind: ex === 'codex' ? 'codex' : 'claude', type: ex === 'codex' ? 'codex' : 'general-purpose', executor: (EXEC_NAME[t.executor] || t.executor === 'claude') ? ex : t.executor, model: MODEL[ex] || t.model || null,
      description: '#' + t.id + ' ' + t.title, taskId: t.id, status: 'running', startedAt: new Date().toISOString(), endedAt: null, activity: (POOL[ex] || POOL.sonnet)[0],
      tokens: zeroTok() });
    t.attemptCount = (t.attemptCount || 0) + 1;
    (t.attemptList = t.attemptList || []).push({ n: t.attemptCount, provider: t.executor, model: t.model || MODEL[ex] || null, effort: t.effort || null, startedAt: new Date().toISOString(), endedAt: null, outcome: null, tokens: null });
    t.merged = false;
    if (!t.branch && s.board.integration) t.branch = s.board.integration.branch.replace(/\/main$/, '') + '/' + t.id;
  };
  /* close the open attempt record: outcome and the tokens the attempt spent */
  const closeAttempt = (s, t, outcome) => {
    const open = (t.attemptList || []).findLast((x) => x.outcome === null);
    if (!open) return;
    const ag = s.agents.find((x) => x.taskId === t.id);
    open.outcome = outcome; open.endedAt = new Date().toISOString(); open.tokens = ag ? ag.tokens.spent : 0;
  };
  const finish = (s, t) => { for (const a of s.agents) if (a.taskId === t.id && a.status === 'running') { a.status = 'completed'; a.endedAt = new Date().toISOString(); } };

  const advance = (s, pr) => {
    if (s.board) {
      const T = s.board.tasks, done = (id) => (T.find((x) => x.id === id) || { status: 'done' }).status === 'done';
      const opts = [];
      for (const t of T) {
        if (t.status === 'review') opts.push(() => { t.status = Math.random() < 0.2 ? 'rework' : 'done'; if (t.status === 'rework') t.note = 'needs changes'; else t.merged = true; closeAttempt(s, t, t.status === 'rework' ? 'rework' : 'accepted'); finish(s, t); });
        else if (t.status === 'running') opts.push(() => { finish(s, t); t.status = Math.random() < 0.5 ? 'review' : 'done'; if (t.status === 'done') { t.merged = true; closeAttempt(s, t, 'accepted'); } });
        else if (t.status === 'rework') opts.push(() => {
          if (t.executor === 'sonnet' && Math.random() < 0.6) { t.executor = 'codex'; t.model = 'gpt-6.1-sol'; t.effort = 'high'; }   /* escalate to a stronger hand: Codex, never Opus */
          t.status = 'running'; spawn(s, t);
        });
        else if (t.status === 'queued' && (t.dependsOn || []).every(done)) opts.push(() => { t.status = 'running'; spawn(s, t); });
      }
      if (opts.length) { opts[rnd(0, opts.length - 1)](); s._idle = 0; }
      else {
        s._idle = (s._idle || 0) + 1;
        if (s._idle === 2 && s.board.integration) s.board.integration.landedAt = new Date().toISOString();   /* everything merged: land it in the working tree */
        if (s._idle > 5) { Object.assign(s, structuredClone(pr)); rebase(s, Date.now() - Date.parse(base.generatedAt)); s._idle = 0; }
      }
    } else {
      const run = s.agents.filter((a) => a.status === 'running');
      if (run.length && Math.random() < 0.6) { const a = run[rnd(0, run.length - 1)]; a.status = 'completed'; a.endedAt = new Date().toISOString(); a.activity = 'finished'; }
      else if (!run.length && (s._idle = (s._idle || 0) + 1) > 3) { Object.assign(s, structuredClone(pr)); rebase(s, Date.now() - Date.parse(base.generatedAt)); s._idle = 0; }
    }
  };

  setInterval(() => {
    tick++;
    const now = Date.now();
    snap.generatedAt = new Date(now).toISOString();
    snap.sessions.forEach((s, i) => {
      if (isIdle(s)) { recompute(s); return; }                  /* idle sessions keep their old activity time */
      s.updatedAt = new Date(now - rnd(0, 1500)).toISOString();
      s.orchestrator.tokens.output += rnd(4, 60); s.orchestrator.tokens.input += rnd(0, 25); s.orchestrator.tokens.cacheRead += rnd(500, 4000);
      for (const a of s.agents) if (a.status === 'running') {
        a.tokens.input += rnd(30, 420); a.tokens.output += rnd(30, 280); a.tokens.cacheRead += rnd(1500, 9000);
        if (a.kind !== 'codex') a.tokens.cacheWrite += rnd(0, 320);
        a.tokens.spent = spentOf(a.tokens);
        if (tick % 4 === 0) { const p = POOL[a.executor] || POOL.sonnet; a.activity = p[rnd(0, p.length - 1)]; }
      }
      if (s.kb) {                                                 /* the shared memory keeps paying off */
        s.kb.hits += rnd(0, 2); s.kb.savedTokens += rnd(0, 900);
        if (tick % 10 === 0) {
          const n = NOTE_POOL[(tick / 10) % NOTE_POOL.length];
          s.kb.notes++;
          s.kb.recent.unshift({ id: 100 + tick, kind: n[0], title: n[1], author: n[2], taskId: null, stale: false, updatedAt: new Date().toISOString() });
          s.kb.recent.length = Math.min(s.kb.recent.length, 8);
        }
      }
      if (tick % 4 === 0) advance(s, pristine.sessions[i]);
      recompute(s);
    });
    render(snap);
  }, 1200);
}

/* ================= boot ================= */
const qs = new URLSearchParams(location.search);
renderChrome([]);
if (qs.get('mock')) startMock(); else startLive();
})();
</script>
